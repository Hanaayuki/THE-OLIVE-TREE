name: the_olive_tree
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  syncfusion_flutter_pdfviewer: any
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  file_picker: ^10.3.2
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  audioplayers: ^6.0.0 

flutter:
  uses-material-design: true

  assets:
    - assets/audio/musica1.mp3
    - assets/audio/musica2.mp3


    - assets/images/icono.png
    - assets/images/pantalla_de_carga.png
    - assets/images/pantalla_de_bienvenida.png

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icono.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/icono.png"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/pantalla_de_carga.png"
  fullscreen: true
  android_12:
    color: "#000000"
    image: "assets/images/pantalla_de_carga.png"
    icon_background_color: "#000000"